# Drift code generation + schema snapshots for migration tests
# (Docs/22 §5: every schema change bumps schemaVersion and ships a tested
# migration). `dart run drift_dev make-migrations` writes the snapshots to
# drift_schemas/ and the step-by-step helpers + tests under test/.
targets:
  $default:
    builders:
      drift_dev:
        options:
          databases:
            app_database: lib/core/database/app_database.dart
          schema_dir: drift_schemas/
          test_dir: test/drift/
