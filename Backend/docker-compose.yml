services:
  postgres:
    image: postgres:16-alpine
    container_name: needle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-needle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-needle_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-needle_dev}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-needle} -d ${POSTGRES_DB:-needle_dev}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: needle-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: needle-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-needle_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-needle_minio_password}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: creates the evidence bucket so the app never has to bootstrap storage itself.
  minio-init:
    image: minio/mc:RELEASE.2025-01-17T23-25-50Z
    container_name: needle-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-needle_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-needle_minio_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-needle-evidence}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      echo 'MinIO bucket ready:' $$MINIO_BUCKET
      "

volumes:
  postgres-data:
  redis-data:
  minio-data:
